<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistema de Gestão de Membros & Células — Comunidade Cristã Wave.">
  <meta name="theme-color" content="#000000">
  <title>Wave Células — Gestão de Membros & Células</title>

  <!-- Favicon Oficial Wave -->
  <link rel="icon" type="image/png" href="imagens/logo_wave.PNG">
  <link rel="apple-touch-icon" href="imagens/logo_wave.PNG">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="toast-container" id="toast-container"></div>

  <div class="app">

    <!-- ── Navbar Superior Desktop ── -->
    <nav class="admin-navbar" id="admin-top-navbar" style="display:none;">
      <div class="admin-navbar-content">
        <a class="admin-navbar-brand" onclick="WaveApp.navigate('admin')">
          <img src="imagens/Logo-Wave-(Padrao).png" alt="Wave Logo" style="height:32px;width:auto;object-fit:contain;">
        </a>

        <div class="admin-navbar-links">
          <a class="admin-nav-link" data-page="admin" onclick="WaveApp.navigate('admin')">
            <i data-lucide="layout-dashboard" style="width:15px;height:15px;"></i> Painel
          </a>
          <a class="admin-nav-link" data-page="admin-membros" onclick="WaveApp.navigate('admin-membros')">
            <i data-lucide="users" style="width:15px;height:15px;"></i> Membros
          </a>
          <a class="admin-nav-link" data-page="admin-lideres" onclick="WaveApp.navigate('admin-lideres')">
            <i data-lucide="crown" style="width:15px;height:15px;"></i> Células
          </a>
          <a class="admin-nav-link" data-page="admin-usuarios" onclick="WaveApp.navigate('admin-usuarios')">
            <i data-lucide="key-round" style="width:15px;height:15px;"></i> Permissões
          </a>
          <a class="admin-nav-link" data-page="importacao" onclick="WaveApp.navigate('importacao')">
            <i data-lucide="upload-cloud" style="width:15px;height:15px;"></i> Importar
          </a>
        </div>

        <!-- Controles do Usuário & Tema -->
        <div style="display:flex;align-items:center;gap:8px;">
          <!-- Botão Toggle Tema Dark/Light Desktop -->
          <button type="button" class="theme-toggle-btn btn-icon-only" onclick="WaveTheme.toggle()" title="Alternar Tema Claro/Escuro" style="width:38px;height:38px;">
            <i data-lucide="sun" style="width:16px;height:16px;"></i>
          </button>

          <!-- Perfil do Usuário & Menu Dropdown Popover -->
          <div class="admin-user-menu-container">
            <div class="admin-user-pill" id="admin-user-pill" onclick="WaveApp.toggleUserMenu(event)">
              <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%2327272a' rx='40'/%3E%3Ccircle cx='40' cy='31' r='13' fill='%23a1a1aa'/%3E%3Cpath d='M19 67c0-11.6 9.4-21 21-21s21 9.4 21 21z' fill='%23a1a1aa'/%3E%3C/svg%3E" class="admin-avatar" id="header-avatar-img" alt="Avatar">
              <div class="admin-user-info-text">
                <span class="admin-user-name" id="header-user-name">Admin</span>
                <span class="admin-user-role" id="header-user-role">ADMIN</span>
              </div>
              <i data-lucide="chevron-down" style="width:14px;height:14px;color:var(--text-tertiary);"></i>
            </div>

            <!-- Menu Popover do Perfil -->
            <div class="admin-user-dropdown" id="admin-user-dropdown">
              <div class="dropdown-header-user">
                <strong id="dropdown-user-name">Usuário</strong>
                <span id="dropdown-user-email"></span>
              </div>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" onclick="WaveApp.navigate('perfil-usuario'); WaveApp.closeUserMenu();">
                <i data-lucide="user" style="width:16px;height:16px;"></i> Meu Perfil & Dados
              </a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item danger" onclick="WaveAuth.logout();">
                <i data-lucide="log-out" style="width:16px;height:16px;"></i> Sair da Conta
              </a>
            </div>
          </div>
        </div>

      </div>
    </nav>

    <!-- ── Header Mobile ── -->
    <header class="header" id="mobile-header" style="display:none;">
      <div class="header-brand" onclick="WaveApp.navigate('admin')" style="cursor:pointer;display:flex;align-items:center;">
        <img src="imagens/W_logo.jpg" alt="Wave" style="height:32px;width:32px;border-radius:8px;object-fit:cover;box-shadow:0 2px 8px rgba(255,255,255,0.1);">
      </div>

      <div class="header-actions" style="display:flex;align-items:center;gap:10px;">
        <button type="button" class="theme-toggle-btn btn-icon-only" onclick="WaveTheme.toggle()" title="Alternar Tema Claro/Escuro" style="width:34px;height:34px;">
          <i data-lucide="sun" style="width:16px;height:16px;"></i>
        </button>
        <div class="header-avatar" onclick="WaveApp.navigate('perfil-usuario')" title="Meu Perfil">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%2327272a' rx='40'/%3E%3Ccircle cx='40' cy='31' r='13' fill='%23a1a1aa'/%3E%3Cpath d='M19 67c0-11.6 9.4-21 21-21s21 9.4 21 21z' fill='%23a1a1aa'/%3E%3C/svg%3E" id="mobile-header-avatar-img" alt="Admin">
        </div>
      </div>
    </header>

    <!-- ── Conteúdo Dinâmico SPA ── -->
    <main class="main-content" id="page-content">
      <!-- Conteúdo renderizado via JS -->
    </main>

    <!-- ── Navegação Inferior Mobile ── -->
    <nav class="bottom-nav admin-bottom-nav" id="admin-nav" style="display:none;">
      <a class="nav-item" data-page="admin" onclick="WaveApp.navigate('admin')">
        <i data-lucide="layout-dashboard"></i>
        <span>Painel</span>
      </a>
      <a class="nav-item" data-page="admin-membros" onclick="WaveApp.navigate('admin-membros')">
        <i data-lucide="users"></i>
        <span>Membros</span>
      </a>
      <a class="nav-item" data-page="admin-lideres" onclick="WaveApp.navigate('admin-lideres')">
        <i data-lucide="crown"></i>
        <span>Células</span>
      </a>
      <a class="nav-item" data-page="admin-usuarios" onclick="WaveApp.navigate('admin-usuarios')">
        <i data-lucide="key-round"></i>
        <span>Acessos</span>
      </a>
      <a class="nav-item" data-page="importacao" onclick="WaveApp.navigate('importacao')">
        <i data-lucide="upload-cloud"></i>
        <span>Importar</span>
      </a>
    </nav>

  </div>

  <!-- ── Scripts ── -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>

  <!-- Autenticação & Login -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/boas-vindas.js"></script>
  <script src="js/pages/perfil-usuario.js"></script>

  <!-- Páginas de Gestão v1 -->
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/admin-membros.js"></script>
  <script src="js/pages/admin-lideres.js"></script>
  <script src="js/pages/admin-usuarios.js"></script>
  <script src="js/pages/importacao.js"></script>

  <!-- Controller Principal SPA -->
  <script src="js/app.js"></script>

</body>
</html>
