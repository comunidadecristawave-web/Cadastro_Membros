<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Membro - Cadastro de Membros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imagens/IMG_2261.PNG">
  <style>
    .detalhe-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }

    .detalhe-content {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--espaco-xl) var(--espaco-md);
    }

    .detalhe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--espaco-md);
      margin-bottom: var(--espaco-xl);
      flex-wrap: wrap;
    }

    .detalhe-header h1 {
      margin: 0;
      font-size: var(--fonte-tamanho-xl);
      color: var(--cor-fundo-dark);
    }

    .detalhe-card {
      background: var(--cor-fundo);
      border-radius: var(--raio-lg);
      box-shadow: var(--sombra-md);
      padding: var(--espaco-xl);
    }

    .detalhe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-lg);
    }

    .detalhe-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: var(--raio-md);
      padding: var(--espaco-md);
    }

    .detalhe-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--cor-texto-light);
      margin-bottom: 4px;
      font-weight: var(--fonte-peso-semibold);
    }

    .detalhe-valor {
      color: var(--cor-fundo-dark);
      font-weight: var(--fonte-peso-medium);
    }

    .acoes {
      margin-top: var(--espaco-xl);
      display: flex;
      gap: var(--espaco-sm);
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: var(--raio-md);
      padding: var(--espaco-sm) var(--espaco-md);
      font-weight: var(--fonte-peso-medium);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transicao-rapida);
    }

    .btn-primario {
      background: var(--cor-primaria);
      color: var(--cor-fundo);
    }

    .btn-primario:hover {
      background: var(--cor-primaria-dark);
    }

    .btn-neutro {
      background: #eef2f7;
      color: #1f2937;
    }

    .btn-neutro:hover {
      background: #e2e8f0;
    }

    .btn-celula {
      background: #4f46e5;
      color: var(--cor-fundo);
    }

    .btn-celula:hover {
      background: #4338ca;
    }

    .status-ativo,
    .status-inativo {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: var(--fonte-peso-semibold);
    }

    .status-ativo {
      background: #dcfce7;
      color: #166534;
    }

    .status-inativo {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 768px) {
      .detalhe-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <a class="navbar-brand" href="/dashboard.html">WAVE</a>
      <button class="navbar-hamburger" id="btnHamburger" aria-label="Abrir menu" style="display:none">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
      <div class="navbar-user">
        <span id="nomeUsuario">Carregando...</span>
        <button class="btn-logout">Sair</button>
      </div>
    </div>
    <div class="navbar-mobile-overlay" id="navbarMobileOverlay" style="display:none">
      <div class="navbar-mobile-menu">
        <button class="navbar-mobile-close" id="btnCloseMobileMenu" aria-label="Fechar menu">✕</button>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
    </div>
    <style>
      @media (max-width: 900px) {
        .navbar-menu {
          display: none !important;
        }
        .navbar-hamburger {
          display: block !important;
          background: none;
          border: none;
          margin-left: auto;
          cursor: pointer;
          padding: 6px;
        }
        .navbar-mobile-overlay {
          display: none;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.7);
          z-index: 2000;
          align-items: flex-start;
          justify-content: flex-end;
        }
        .navbar-mobile-overlay.ativo {
          display: flex !important;
        }
        .navbar-mobile-menu {
          background: var(--cor-fundo-dark);
          color: var(--cor-fundo);
          width: 220px;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          gap: var(--espaco-lg);
          padding: var(--espaco-xl) var(--espaco-lg) var(--espaco-lg) var(--espaco-lg);
          box-shadow: -2px 0 12px rgba(0,0,0,0.2);
          position: relative;
        }
        .navbar-mobile-menu a {
          color: var(--cor-fundo);
          font-size: var(--fonte-tamanho-lg);
          font-weight: var(--fonte-peso-semibold);
          text-decoration: none;
          padding: var(--espaco-md) 0;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .navbar-mobile-close {
          position: absolute;
          top: var(--espaco-md);
          right: var(--espaco-md);
          background: none;
          border: none;
          color: var(--cor-fundo);
          font-size: 28px;
          cursor: pointer;
        }
      }
    </style>
    <script>
      // Menu hambúrguer mobile
      const btnHamburger = document.getElementById('btnHamburger');
      const navbarMobileOverlay = document.getElementById('navbarMobileOverlay');
      const btnCloseMobileMenu = document.getElementById('btnCloseMobileMenu');
      function abrirMenuMobile() {
        navbarMobileOverlay.classList.add('ativo');
        navbarMobileOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function fecharMenuMobile() {
        navbarMobileOverlay.classList.remove('ativo');
        navbarMobileOverlay.style.display = 'none';
        document.body.style.overflow = '';
      }
      btnHamburger.addEventListener('click', abrirMenuMobile);
      btnCloseMobileMenu.addEventListener('click', fecharMenuMobile);
      navbarMobileOverlay.addEventListener('click', function(e) {
        if (e.target === navbarMobileOverlay) fecharMenuMobile();
      });
      // Mostrar botão só no mobile
      function toggleHamburger() {
        if (window.innerWidth <= 900) {
          btnHamburger.style.display = 'block';
        } else {
          btnHamburger.style.display = 'none';
          fecharMenuMobile();
        }
      }
      window.addEventListener('resize', toggleHamburger);
      toggleHamburger();
    </script>
  </nav>

  <div class="detalhe-container">
    <div class="detalhe-content">
      <div class="detalhe-header">
        <h1 id="tituloMembro">Visualizar Membro</h1>
        <a href="/membros.html" class="btn btn-neutro">Voltar</a>
      </div>

      <div class="detalhe-card" id="cardMembro">
        <div class="loading-state" id="loading" style="display:block;">
          <div class="spinner"></div>
          <p style="margin-top: var(--espaco-md); color: var(--cor-texto-light);">Carregando dados...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    if (!protegerRota()) throw new Error('Não autenticado');

    const params = new URLSearchParams(window.location.search);
    const membroId = params.get('id');
    const cardMembro = DOM.obter('#cardMembro');
    const tituloMembro = DOM.obter('#tituloMembro');

    function valor(v) {
      return v ? v : '—';
    }

    function calcularIdade(dataNascimento) {
      if (!dataNascimento) return '—';
      const hoje = new Date();
      const nasc = new Date(dataNascimento + 'T00:00:00');
      if (Number.isNaN(nasc.getTime())) return '—';
      let idade = hoje.getFullYear() - nasc.getFullYear();
      const m = hoje.getMonth() - nasc.getMonth();
      if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
      return idade >= 0 ? `${idade} anos` : '—';
    }

    function calcularTempoMembro(dataIngresso) {
      if (!dataIngresso) return '—';
      const hoje = new Date();
      const ingresso = new Date(dataIngresso + 'T00:00:00');
      if (Number.isNaN(ingresso.getTime()) || ingresso > hoje) return '—';

      let anos = hoje.getFullYear() - ingresso.getFullYear();
      let meses = hoje.getMonth() - ingresso.getMonth();
      if (hoje.getDate() < ingresso.getDate()) meses--;
      if (meses < 0) {
        anos--;
        meses += 12;
      }
      if (anos < 0) return '—';
      return anos > 0 ? `${anos} ano(s) e ${meses} mês(es)` : `${meses} mês(es)`;
    }

    async function carregar() {
      if (!membroId) {
        Notificacao.aviso('Membro não informado');
        window.location.href = '/membros.html';
        return;
      }

      try {
        const membro = await MembrosApi.obter(membroId);
        const celulasResp = await CelulasApi.listar(1, 300);
        const celulaLiderada = (celulasResp.items || []).find(c => c.leaderId === membroId || c.leader?.id === membroId);

        if (!membro) {
          Notificacao.aviso('Membro não encontrado');
          window.location.href = '/membros.html';
          return;
        }

        tituloMembro.textContent = membro.fullName || 'Visualizar Membro';

        cardMembro.innerHTML = `
          <div class="detalhe-grid">
            <div class="detalhe-item">
              <div class="detalhe-label">Nome completo</div>
              <div class="detalhe-valor">${valor(membro.fullName)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Status</div>
              <div class="detalhe-valor">${membro.isActive ? '<span class="status-ativo">Ativo</span>' : '<span class="status-inativo">Inativo</span>'}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Data nascimento</div>
              <div class="detalhe-valor">${valor(Formatador.dataBR(membro.birthDate))}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Idade</div>
              <div class="detalhe-valor">${calcularIdade(membro.birthDate)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Data de ingresso</div>
              <div class="detalhe-valor">${valor(Formatador.dataBR(membro.joinDate))}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Membro há</div>
              <div class="detalhe-valor">${calcularTempoMembro(membro.joinDate)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Tipo de ingresso</div>
              <div class="detalhe-valor">${valor(membro.joinType)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Telefone</div>
              <div class="detalhe-valor">${valor(Formatador.telefone(membro.phone || ''))}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Email</div>
              <div class="detalhe-valor">${valor(membro.email)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Célula</div>
              <div class="detalhe-valor">${valor(membro.cell?.name)}</div>
              ${celulaLiderada ? `<div style="margin-top: 8px;"><a class="btn btn-celula" href="/visualizar-celula.html?liderId=${membro.id}">Ver célula</a></div>` : ''}
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Bairro</div>
              <div class="detalhe-valor">${valor(membro.addressNeighborhood)}</div>
            </div>
            <div class="detalhe-item">
              <div class="detalhe-label">Cidade</div>
              <div class="detalhe-valor">${valor(membro.addressCity)}</div>
            </div>
            <div class="detalhe-item" style="grid-column: 1 / -1;">
              <div class="detalhe-label">Rua</div>
              <div class="detalhe-valor">${valor(membro.addressStreet)}</div>
            </div>
          </div>

          <div class="acoes">
            <a class="btn btn-primario" href="/cadastro-membro.html?id=${membro.id}">Editar Membro</a>
            <a class="btn btn-neutro" href="/membros.html">Voltar para lista</a>
          </div>
        `;
      } catch (erro) {
        console.error(erro);
        Notificacao.erro('Erro ao carregar membro');
      }
    }

    carregar();
  </script>
</body>
</html>
