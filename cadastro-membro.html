<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membro - Cadastro de Membros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imagens/IMG_2261.PNG">
  <style>
    .cadastro-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }

    .cadastro-content {
      max-width: 700px;
      margin: 0 auto;
      padding: var(--espaco-xl) var(--espaco-md);
    }

    .cadastro-header {
      display: flex;
      align-items: center;
      gap: var(--espaco-md);
      margin-bottom: var(--espaco-xl);
      animation: slideDown 0.5s ease-out;
    }

    .cadastro-header-icon {
      font-size: 36px;
    }

    .cadastro-header h1 {
      font-size: var(--fonte-tamanho-xl);
      color: var(--cor-fundo-dark);
      margin: 0;
    }

    .formulario-container {
      background: var(--cor-fundo);
      border-radius: var(--raio-lg);
      padding: var(--espaco-2xl);
      box-shadow: var(--sombra-lg);
      animation: slideUp 0.5s ease-out;
    }

    .grupo-form {
      margin-bottom: var(--espaco-lg);
    }

    .grupo-form-duplo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-lg);
    }

    label {
      display: block;
      margin-bottom: var(--espaco-sm);
      font-weight: var(--fonte-peso-semibold);
      color: var(--cor-texto);
      font-size: var(--fonte-tamanho-sm);
    }

    label .obrigatorio {
      color: var(--cor-erro);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: var(--espaco-sm) var(--espaco-md);
      border: 2px solid var(--cor-borda);
      border-radius: var(--raio-md);
      font-size: var(--fonte-tamanho-base);
      font-family: var(--fonte-principal);
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      transition: all var(--transicao-rapida);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--cor-primaria);
      box-shadow: 0 0 0 4px var(--cor-primaria-light);
    }

    input::placeholder {
      color: var(--cor-texto-light);
    }

    .mensagem-erro {
      color: var(--cor-erro);
      font-size: var(--fonte-tamanho-sm);
      margin-top: var(--espaco-xs);
      display: none;
    }

    .grupo-form.invalido input,
    .grupo-form.invalido select,
    .grupo-form.invalido textarea {
      border-color: var(--cor-erro);
    }

    .grupo-form.invalido .mensagem-erro {
      display: block;
      animation: shake 0.3s ease-in-out;
    }

    .campo-ajuda {
      font-size: var(--fonte-tamanho-sm);
      color: var(--cor-texto-light);
      margin-top: var(--espaco-xs);
    }

    .secao-titulo {
      font-size: var(--fonte-tamanho-lg);
      font-weight: var(--fonte-peso-bold);
      color: var(--cor-fundo-dark);
      margin-top: var(--espaco-lg);
      margin-bottom: var(--espaco-md);
      padding-bottom: var(--espaco-md);
      border-bottom: 2px solid var(--cor-primaria-light);
    }

    .btn-status {
      padding: var(--espaco-md) var(--espaco-xl);
      border: none;
      border-radius: var(--raio-md);
      color: var(--cor-fundo);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
    }

    .btn-status.inativar {
      background: var(--cor-erro);
    }

    .btn-status.reativar {
      background: var(--cor-sucesso);
    }

    .grupo-botoes {
      display: flex;
      gap: var(--espaco-md);
      margin-top: var(--espaco-2xl);
      justify-content: flex-end;
    }

    .btn-enviar {
      flex: 1;
      max-width: 300px;
      padding: var(--espaco-md) var(--espaco-xl);
      background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-primaria-dark) 100%);
      color: var(--cor-fundo);
      border: none;
      border-radius: var(--raio-md);
      font-family: var(--fonte-principal);
      font-size: var(--fonte-tamanho-base);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
      transition: all var(--transicao-rapida);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--espaco-sm);
    }

    .btn-enviar:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--sombra-lg);
    }

    .btn-enviar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-cancelar {
      padding: var(--espaco-md) var(--espaco-xl);
      background: var(--cor-fundo-alt);
      color: var(--cor-texto);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
      font-family: var(--fonte-principal);
      font-size: var(--fonte-tamanho-base);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
      transition: all var(--transicao-rapida);
      text-decoration: none;
    }

    .btn-cancelar:hover {
      background: var(--cor-fundo);
      border-color: var(--cor-primaria);
    }

    .loading-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .info-box {
      background: var(--cor-primaria-light);
      border-left: 4px solid var(--cor-primaria);
      padding: var(--espaco-md);
      border-radius: var(--raio-md);
      margin-bottom: var(--espaco-lg);
      font-size: var(--fonte-tamanho-sm);
      color: var(--cor-primaria-dark);
    }

    .bloco-dados-celula {
      display: none;
      margin-top: var(--espaco-md);
      border: 1px dashed var(--cor-borda);
      border-radius: var(--raio-md);
      padding: var(--espaco-md);
      background: #f8fafc;
    }

    .bloco-dados-celula.ativo {
      display: block;
    }

    .helper-celula {
      font-size: var(--fonte-tamanho-sm);
      color: var(--cor-texto-light);
      margin-bottom: var(--espaco-sm);
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: var(--espaco-sm);
      margin-bottom: var(--espaco-md);
    }

    .checkbox-inline input {
      width: auto;
      margin: 0;
    }

    .checkbox-inline label {
      margin: 0;
      font-weight: var(--fonte-peso-medium);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .grupo-form-duplo {
        grid-template-columns: 1fr;
      }

      .formulario-container {
        padding: var(--espaco-lg);
      }

      .grupo-botoes {
        flex-direction: column;
      }

      .btn-enviar,
      .btn-cancelar {
        max-width: none;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <a class="navbar-brand" href="/dashboard.html">WAVE</a>
      <button class="navbar-hamburger" id="btnHamburger" aria-label="Abrir menu" style="display:none">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
      <div class="navbar-user">
        <span id="nomeUsuario">Carregando...</span>
        <button class="btn-logout">Sair</button>
      </div>
    </div>
    <div class="navbar-mobile-overlay" id="navbarMobileOverlay" style="display:none">
      <div class="navbar-mobile-menu">
        <button class="navbar-mobile-close" id="btnCloseMobileMenu" aria-label="Fechar menu">✕</button>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
    </div>
    <style>
      @media (max-width: 900px) {
        .navbar-menu {
          display: none !important;
        }
        .navbar-hamburger {
          display: block !important;
          background: none;
          border: none;
          margin-left: auto;
          cursor: pointer;
          padding: 6px;
        }
        .navbar-mobile-overlay {
          display: none;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.7);
          z-index: 2000;
          align-items: flex-start;
          justify-content: flex-end;
        }
        .navbar-mobile-overlay.ativo {
          display: flex !important;
        }
        .navbar-mobile-menu {
          background: var(--cor-fundo-dark);
          color: var(--cor-fundo);
          width: 220px;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          gap: var(--espaco-lg);
          padding: var(--espaco-xl) var(--espaco-lg) var(--espaco-lg) var(--espaco-lg);
          box-shadow: -2px 0 12px rgba(0,0,0,0.2);
          position: relative;
        }
        .navbar-mobile-menu a {
          color: var(--cor-fundo);
          font-size: var(--fonte-tamanho-lg);
          font-weight: var(--fonte-peso-semibold);
          text-decoration: none;
          padding: var(--espaco-md) 0;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .navbar-mobile-close {
          position: absolute;
          top: var(--espaco-md);
          right: var(--espaco-md);
          background: none;
          border: none;
          color: var(--cor-fundo);
          font-size: 28px;
          cursor: pointer;
        }
      }
    </style>
    <script>
      // Menu hambúrguer mobile
      const btnHamburger = document.getElementById('btnHamburger');
      const navbarMobileOverlay = document.getElementById('navbarMobileOverlay');
      const btnCloseMobileMenu = document.getElementById('btnCloseMobileMenu');
      function abrirMenuMobile() {
        navbarMobileOverlay.classList.add('ativo');
        navbarMobileOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function fecharMenuMobile() {
        navbarMobileOverlay.classList.remove('ativo');
        navbarMobileOverlay.style.display = 'none';
        document.body.style.overflow = '';
      }
      btnHamburger.addEventListener('click', abrirMenuMobile);
      btnCloseMobileMenu.addEventListener('click', fecharMenuMobile);
      navbarMobileOverlay.addEventListener('click', function(e) {
        if (e.target === navbarMobileOverlay) fecharMenuMobile();
      });
      // Mostrar botão só no mobile
      function toggleHamburger() {
        if (window.innerWidth <= 900) {
          btnHamburger.style.display = 'block';
        } else {
          btnHamburger.style.display = 'none';
          fecharMenuMobile();
        }
      }
      window.addEventListener('resize', toggleHamburger);
      toggleHamburger();
    </script>
  </nav>

  <div class="cadastro-container">
    <div class="cadastro-content">
      <div class="cadastro-header">
        <div class="cadastro-header-icon">+</div>
        <h1>Novo Membro</h1>
      </div>

      <div class="formulario-container">
        <div class="info-box">
          Preencha todos os campos obrigatórios marcados com <span class="obrigatorio">*</span>
        </div>

        <form id="formMembro" class="formulario">
          <h3 class="secao-titulo">Dados Pessoais</h3>

            <div class="grupo-form">
              <label for="fullName">Nome Completo <span class="obrigatorio">*</span></label>
              <input type="text" id="fullName" name="fullName" placeholder="Digite o nome completo" required>
              <div class="mensagem-erro" data-campo="fullName"></div>
              <div class="campo-ajuda">Mínimo 3 caracteres</div>
            </div>

            <div class="grupo-form-duplo">
              <div class="grupo-form">
                <label for="birthDate">Data de Nascimento <span class="obrigatorio">*</span></label>
                <input type="date" id="birthDate" name="birthDate" required>
                <div class="mensagem-erro" data-campo="birthDate"></div>
              </div>

              <div class="grupo-form">
                <label for="phone">Telefone (celular) <span class="obrigatorio">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999" required>
                <div class="mensagem-erro" data-campo="phone"></div>
              </div>
            </div>

            <div class="grupo-form-duplo">
              <div class="grupo-form">
                <label for="joinDate">Data de Ingresso <span class="obrigatorio">*</span></label>
                <input type="date" id="joinDate" name="joinDate" required>
                <div class="mensagem-erro" data-campo="joinDate"></div>
              </div>

              <div class="grupo-form">
                <label for="joinType">Tipo de Ingresso <span class="obrigatorio">*</span></label>
                <select id="joinType" name="joinType" required>
                  <option value="">Selecione...</option>
                  <option value="Batismo">Batismo</option>
                  <option value="Recepção">Recepção</option>
                </select>
                <div class="mensagem-erro" data-campo="joinType"></div>
              </div>
            </div>

            <div class="grupo-form">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="email@exemplo.com">
              <div class="mensagem-erro" data-campo="email"></div>
            </div>

            <h3 class="secao-titulo">Endereço</h3>

            <div class="grupo-form">
              <label for="addressStreet">Rua/Avenida <span class="obrigatorio">*</span></label>
              <input type="text" id="addressStreet" name="addressStreet" placeholder="Nome da rua">
              <div class="mensagem-erro" data-campo="addressStreet"></div>
            </div>

            <div class="grupo-form">
              <label for="addressNumber">Número <span class="obrigatorio">*</span></label>
              <input type="text" id="addressNumber" name="addressNumber" placeholder="Número da casa">
              <div class="mensagem-erro" data-campo="addressNumber"></div>
            </div>

            <div class="grupo-form">
              <label for="addressComplement">Complemento</label>
              <input type="text" id="addressComplement" name="addressComplement" placeholder="Apartamento, bloco, referência...">
              <div class="mensagem-erro" data-campo="addressComplement"></div>
            </div>

            <div class="grupo-form-duplo">
              <div class="grupo-form">
                <label for="addressNeighborhood">Bairro <span class="obrigatorio">*</span></label>
                <input type="text" id="addressNeighborhood" name="addressNeighborhood" placeholder="Nome do bairro">
                <div class="mensagem-erro" data-campo="addressNeighborhood"></div>
              </div>

              <div class="grupo-form">
                <label for="addressCity">Cidade <span class="obrigatorio">*</span></label>
                <input type="text" id="addressCity" name="addressCity" placeholder="Nome da cidade">
                <div class="mensagem-erro" data-campo="addressCity"></div>
              </div>
            </div>
          <h3 class="secao-titulo">Rede de Célula</h3>

            <div class="grupo-form">
              <label for="leaderId">Discipulado por (Líder) <span class="obrigatorio">*</span></label>
              <select id="leaderId" name="leaderId" required>
                <option value="">Selecione um líder...</option>
              </select>
              <div class="mensagem-erro" data-campo="leaderId"></div>
            </div>

            <div class="grupo-form">
              <label for="category">Categoria <span class="obrigatorio">*</span></label>
              <select id="category" name="category" required>
                <option value="">Selecione a categoria...</option>
                <option value="Kids">Kids</option>
                <option value="Teens">Teens</option>
                <option value="Adolescente">Adolescente</option>
                <option value="Adulto">Adulto</option>
              </select>
              <div class="mensagem-erro" data-campo="category"></div>
            </div>

            <div class="grupo-form">
              <label for="isCellLeaderSwitch">É líder de célula? <span class="obrigatorio">*</span></label>
              <select id="isCellLeaderSwitch" name="isCellLeaderSwitch" required>
                <option value="nao">Não</option>
                <option value="sim">Sim</option>
              </select>
              <div class="mensagem-erro" data-campo="isCellLeaderSwitch"></div>
            </div>

            <div id="blocoDadosCelula" class="bloco-dados-celula">
              <p class="helper-celula">Preencha estes campos somente para membros líderes.</p>

              <div class="grupo-form-duplo">
                <div class="grupo-form">
                  <label for="cellNumber">Número da célula <span class="obrigatorio">*</span></label>
                  <input type="number" id="cellNumber" min="1" step="1" placeholder="Ex: 1">
                  <div class="mensagem-erro" data-campo="cellNumber"></div>
                </div>
                <div class="grupo-form">
                  <label for="cellDay">Dia da célula <span class="obrigatorio">*</span></label>
                  <select id="cellDay">
                    <option value="">Selecione...</option>
                    <option value="0">Domingo</option>
                    <option value="1">Segunda</option>
                    <option value="2">Terça</option>
                    <option value="3">Quarta</option>
                    <option value="4">Quinta</option>
                    <option value="5">Sexta</option>
                    <option value="6">Sábado</option>
                  </select>
                  <div class="mensagem-erro" data-campo="cellDay"></div>
                </div>
              </div>

              <div class="grupo-form-duplo">
                <div class="grupo-form">
                  <label for="cellTime">Horário da célula <span class="obrigatorio">*</span></label>
                  <input type="time" id="cellTime">
                  <div class="mensagem-erro" data-campo="cellTime"></div>
                </div>
                <div class="grupo-form">
                  <label for="cellTypes">Tipos da célula <span class="obrigatorio">*</span></label>
                  <select id="cellTypes" multiple>
                    <option value="Kids">Kids</option>
                    <option value="Teens">Teens</option>
                    <option value="Adolescente">Adolescente</option>
                    <option value="Adulto">Adulto</option>
                  </select>
                  <div class="mensagem-erro" data-campo="cellTypes"></div>
                </div>
              </div>

              <div class="checkbox-inline">
                <input type="checkbox" id="useResidentialAddress">
                <label for="useResidentialAddress">Usar mesmo endereço residencial</label>
              </div>

              <div class="grupo-form-duplo">
                <div class="grupo-form">
                  <label for="cellStreet">Endereço da célula - Rua <span class="obrigatorio">*</span></label>
                  <input type="text" id="cellStreet" placeholder="Rua da célula">
                  <div class="mensagem-erro" data-campo="cellStreet"></div>
                </div>
                <div class="grupo-form">
                  <label for="cellAddressNumber">Endereço da célula - Número <span class="obrigatorio">*</span></label>
                  <input type="text" id="cellAddressNumber" placeholder="Número">
                  <div class="mensagem-erro" data-campo="cellAddressNumber"></div>
                </div>
              </div>

              <div class="grupo-form-duplo">
                <div class="grupo-form">
                  <label for="cellAddressComplement">Endereço da célula - Complemento</label>
                  <input type="text" id="cellAddressComplement" placeholder="Complemento">
                  <div class="mensagem-erro" data-campo="cellAddressComplement"></div>
                </div>
                <div class="grupo-form">
                  <label for="cellAddressNeighborhood">Endereço da célula - Bairro <span class="obrigatorio">*</span></label>
                  <input type="text" id="cellAddressNeighborhood" placeholder="Bairro">
                  <div class="mensagem-erro" data-campo="cellAddressNeighborhood"></div>
                </div>
              </div>

              <div class="grupo-form">
                <label for="cellAddressCity">Endereço da célula - Cidade <span class="obrigatorio">*</span></label>
                <input type="text" id="cellAddressCity" placeholder="Cidade">
                <div class="mensagem-erro" data-campo="cellAddressCity"></div>
              </div>
            </div>

          <!-- BOTÕES -->
          <div class="grupo-botoes">
            <a href="/membros.html" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-enviar" id="btnEnviar">
              <span class="loading-spinner" id="spinner"></span>
              <span id="btnTexto">Criar Membro</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    if (!protegerRota()) throw new Error('Não autenticado');

    const form = DOM.obter('#formMembro');
    const btnEnviar = DOM.obter('#btnEnviar');
    const spinner = DOM.obter('#spinner');
    const btnTexto = DOM.obter('#btnTexto');
    const leaderId = DOM.obter('#leaderId');
    const phoneInput = DOM.obter('#phone');
    const tituloPagina = DOM.obter('.cadastro-header h1');
    const isCellLeaderSwitch = DOM.obter('#isCellLeaderSwitch');
    const blocoDadosCelula = DOM.obter('#blocoDadosCelula');
    const useResidentialAddress = DOM.obter('#useResidentialAddress');
    const params = new URLSearchParams(window.location.search);
    const membroId = params.get('id');
    const emEdicao = !!membroId;
    let celulasDisponiveis = [];
    let membroEmEdicao = null;
    let celulaDoMembroEmEdicao = null;

    function aplicarMascaraTelefone(valor) {
      const digitos = (valor || '').replace(/\D/g, '').slice(0, 11);
      if (digitos.length <= 2) return digitos;
      if (digitos.length <= 6) return `(${digitos.slice(0, 2)}) ${digitos.slice(2)}`;
      if (digitos.length <= 10) return `(${digitos.slice(0, 2)}) ${digitos.slice(2, 6)}-${digitos.slice(6)}`;
      return `(${digitos.slice(0, 2)}) ${digitos.slice(2, 7)}-${digitos.slice(7)}`;
    }

    phoneInput.addEventListener('input', () => {
      phoneInput.value = aplicarMascaraTelefone(phoneInput.value);
    });

    function alternarCamposLider() {
      const ehLider = isCellLeaderSwitch.value === 'sim';
      if (ehLider) {
        blocoDadosCelula.classList.add('ativo');
      } else {
        blocoDadosCelula.classList.remove('ativo');
      }
    }

    function copiarEnderecoResidencialParaCelula() {
      DOM.obter('#cellStreet').value = DOM.obter('#addressStreet').value.trim();
      DOM.obter('#cellAddressNumber').value = DOM.obter('#addressNumber').value.trim();
      DOM.obter('#cellAddressComplement').value = DOM.obter('#addressComplement').value.trim();
      DOM.obter('#cellAddressNeighborhood').value = DOM.obter('#addressNeighborhood').value.trim();
      DOM.obter('#cellAddressCity').value = DOM.obter('#addressCity').value.trim();
    }

    isCellLeaderSwitch.addEventListener('change', alternarCamposLider);
    useResidentialAddress.addEventListener('change', () => {
      if (useResidentialAddress.checked) {
        copiarEnderecoResidencialParaCelula();
      }
    });

    function dataNaoFutura(dataISO) {
      if (!dataISO) return false;
      const hoje = new Date();
      const data = new Date(dataISO + 'T00:00:00');
      const hojeSemHora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
      return data <= hojeSemHora;
    }

    let mapaCategoriaLideres = {};

    async function carregarSelects() {
      try {
        const [lideresResp, celulasResp, membrosResp] = await Promise.all([
          LideresApi.listar(1, 100),
          CelulasApi.listar(1, 300),
          MembrosApi.listar(1, 500, {})
        ]);

        const membros = membrosResp.items || [];
        const celulas = celulasResp.items || [];
        const idsLideres = new Set();
        const opcoesLideres = [];

        (lideresResp.items || []).forEach(lider => {
          if (lider.isActive === false) return;
          idsLideres.add(lider.id);
          mapaCategoriaLideres[lider.id] = lider.category || 'Adulto';
          opcoesLideres.push({ id: lider.id, nome: lider.fullName });
        });

        celulas.forEach(celula => {
          const idLider = celula.leaderId || celula.leader?.id;
          if (!idLider || idsLideres.has(idLider)) return;
          const membroLider = membros.find(x => x.id === idLider);
          if (!membroLider || membroLider.isActive === false) return;
          idsLideres.add(idLider);
          mapaCategoriaLideres[idLider] = membroLider.category || 'Adulto';
          opcoesLideres.push({ id: idLider, nome: membroLider.fullName });
        });

        opcoesLideres
          .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
          .forEach(lider => {
            const option = DOM.criar('option', { value: lider.id }, lider.nome);
            leaderId.appendChild(option);
          });

        leaderId.addEventListener('change', () => {
          const liderSelecionadoId = leaderId.value;
          if (liderSelecionadoId && mapaCategoriaLideres[liderSelecionadoId]) {
            DOM.obter('#category').value = mapaCategoriaLideres[liderSelecionadoId];
          }
        });

        celulasDisponiveis = celulas;
      } catch (erro) {
        console.error('Erro ao carregar selects:', erro);
        Notificacao.erro('Erro ao carregar dados');
      }
    }
      async function carregarMembroParaEdicao() {
        if (!emEdicao) return;

        try {
          const membro = await MembrosApi.obter(membroId);
          if (!membro) {
            Notificacao.erro('Membro não encontrado');
            setTimeout(() => window.location.href = '/membros.html', 700);
            return;
          }

          membroEmEdicao = membro;

          tituloPagina.textContent = 'Editar Membro';
          btnTexto.textContent = 'Salvar Alterações';

          DOM.obter('#fullName').value = membro.fullName || '';
          DOM.obter('#birthDate').value = (membro.birthDate || '').slice(0, 10);
          DOM.obter('#joinDate').value = (membro.joinDate || '').slice(0, 10);
          DOM.obter('#joinType').value = membro.joinType || '';
          DOM.obter('#phone').value = membro.phone || '';
          DOM.obter('#email').value = membro.email || '';
          DOM.obter('#addressStreet').value = membro.addressStreet || '';
          DOM.obter('#addressNumber').value = membro.addressNumber || '';
          DOM.obter('#addressComplement').value = membro.addressComplement || '';
          DOM.obter('#addressNeighborhood').value = membro.addressNeighborhood || '';
          DOM.obter('#addressCity').value = membro.addressCity || '';
          DOM.obter('#leaderId').value = membro.leaderId || '';
          DOM.obter('#category').value = membro.category || '';

          if (membro.leaderId && mapaCategoriaLideres[membro.leaderId]) {
            DOM.obter('#category').value = mapaCategoriaLideres[membro.leaderId];
          }

          celulaDoMembroEmEdicao = celulasDisponiveis.find(c => (c.leaderId || c.leader?.id) === membroId) || null;
          isCellLeaderSwitch.value = membro.isCellLeader ? 'sim' : 'nao';
          alternarCamposLider();

          if (membro.isCellLeader && celulaDoMembroEmEdicao) {
            const nomeCelula = celulaDoMembroEmEdicao.name || '';
            const numeroMatch = /c[eé]lula\s+(\d+)/i.exec(nomeCelula);
            DOM.obter('#cellNumber').value = numeroMatch ? numeroMatch[1] : '1';
            DOM.obter('#cellDay').value = String(celulaDoMembroEmEdicao.meetingDay ?? '');
            DOM.obter('#cellTime').value = (celulaDoMembroEmEdicao.meetingTime || '19:30:00').slice(0, 5);

            const tiposSelecionados = new Set(Array.isArray(celulaDoMembroEmEdicao.types) ? celulaDoMembroEmEdicao.types : []);
            Array.from(DOM.obter('#cellTypes').options).forEach(op => {
              op.selected = tiposSelecionados.has(op.value);
            });

            DOM.obter('#cellStreet').value = celulaDoMembroEmEdicao.street || '';
            DOM.obter('#cellAddressNumber').value = celulaDoMembroEmEdicao.number || '';
            DOM.obter('#cellAddressComplement').value = celulaDoMembroEmEdicao.complement || '';
            DOM.obter('#cellAddressNeighborhood').value = celulaDoMembroEmEdicao.neighborhood || '';
            DOM.obter('#cellAddressCity').value = celulaDoMembroEmEdicao.city || '';
          }

          const grupoBotoes = DOM.obter('.grupo-botoes');
          const botaoStatus = DOM.criar('button', {
            type: 'button',
            id: 'btnStatusMembro',
            className: `btn-status ${membro.isActive ? 'inativar' : 'reativar'}`
          }, membro.isActive ? 'Inativar Membro' : 'Reativar Membro');

          botaoStatus.addEventListener('click', async () => {
            const acao = membro.isActive ? 'inativar' : 'reativar';
            if (!confirm(`Deseja ${acao} este membro?`)) return;

            try {
              if (membro.isActive) {
                await MembrosApi.inativar(membro.id);
                membro.isActive = false;
                botaoStatus.textContent = 'Reativar Membro';
                botaoStatus.className = 'btn-status reativar';
                Notificacao.sucesso('Membro inativado com sucesso');
              } else {
                await MembrosApi.reativar(membro.id);
                membro.isActive = true;
                botaoStatus.textContent = 'Inativar Membro';
                botaoStatus.className = 'btn-status inativar';
                Notificacao.sucesso('Membro reativado com sucesso');
              }
            } catch (erro) {
              Notificacao.erro(`Erro ao ${acao} membro`);
              console.error(erro);
            }
          });

          grupoBotoes.prepend(botaoStatus);
        } catch (erro) {
          console.error('Erro ao carregar membro para edição:', erro);
          Notificacao.erro('Erro ao carregar dados do membro');
        }
      }

      function mostrarErro(campo, mensagem) {
        const input = document.getElementById(campo);
        if (input) {
          input.parentElement.classList.add('invalido');
          input.parentElement.querySelector('.mensagem-erro').textContent = mensagem;
        }
      }

      function validarFormulario() {
        let valido = true;
        document.querySelectorAll('.grupo-form').forEach(g => g.classList.remove('invalido'));

        const fullName = document.getElementById('fullName').value.trim();
        const birthDate = document.getElementById('birthDate').value;
        const joinDate = document.getElementById('joinDate').value;
        const joinType = document.getElementById('joinType').value;
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const addressStreet = document.getElementById('addressStreet').value.trim();
        const addressNumber = document.getElementById('addressNumber').value.trim();
        const addressNeighborhood = document.getElementById('addressNeighborhood').value.trim();
        const addressCity = document.getElementById('addressCity').value.trim();
        const leaderIdVal = document.getElementById('leaderId').value;
        const categoryVal = document.getElementById('category').value;
        const ehLider = isCellLeaderSwitch.value === 'sim';

        if (!fullName || fullName.length < 3) {
          mostrarErro('fullName', 'Nome obrigatório (mínimo 3 caracteres)');
          valido = false;
        }

        if (!birthDate) {
          mostrarErro('birthDate', 'Data de nascimento obrigatória');
          valido = false;
        } else if (!dataNaoFutura(birthDate)) {
          mostrarErro('birthDate', 'A data não pode ser futura');
          valido = false;
        } else if (!Validador.dataNascimento(birthDate)) {
          mostrarErro('birthDate', 'Data inválida (deve estar entre 13 e 150 anos)');
          valido = false;
        }

        if (!joinDate) {
          mostrarErro('joinDate', 'Data de ingresso obrigatória');
          valido = false;
        } else if (!dataNaoFutura(joinDate)) {
          mostrarErro('joinDate', 'A data não pode ser futura');
          valido = false;
        }

        if (!joinType) {
          mostrarErro('joinType', 'Selecione o tipo de ingresso');
          valido = false;
        }

        if (email && !Validador.email(email)) {
          mostrarErro('email', 'Email inválido');
          valido = false;
        }

        if (!phone) {
          mostrarErro('phone', 'Preencha este campo.');
          valido = false;
        } else if (!Validador.telefone(phone)) {
          mostrarErro('phone', 'Telefone deve ter 10 ou 11 dígitos');
          valido = false;
        }

        if (!addressStreet) {
          mostrarErro('addressStreet', 'Preencha este campo.');
          valido = false;
        }

        if (!addressNumber) {
          mostrarErro('addressNumber', 'Preencha este campo.');
          valido = false;
        }

        if (!addressNeighborhood) {
          mostrarErro('addressNeighborhood', 'Preencha este campo.');
          valido = false;
        }

        if (!addressCity) {
          mostrarErro('addressCity', 'Preencha este campo.');
          valido = false;
        }

        if (!leaderIdVal) {
          mostrarErro('leaderId', 'Selecione o líder responsável por este membro.');
          valido = false;
        }

        if (!categoryVal) {
          mostrarErro('category', 'Selecione uma categoria');
          valido = false;
        }

        if (ehLider) {
          const numeroCelula = DOM.obter('#cellNumber').value.trim();
          const diaCelula = DOM.obter('#cellDay').value;
          const horarioCelula = DOM.obter('#cellTime').value;
          const tiposCelula = Array.from(DOM.obter('#cellTypes').selectedOptions).map(x => x.value);
          const ruaCelula = DOM.obter('#cellStreet').value.trim();
          const numeroEnderecoCelula = DOM.obter('#cellAddressNumber').value.trim();
          const bairroCelula = DOM.obter('#cellAddressNeighborhood').value.trim();
          const cidadeCelula = DOM.obter('#cellAddressCity').value.trim();

          if (!numeroCelula) {
            mostrarErro('cellNumber', 'Informe o número da célula');
            valido = false;
          }

          if (!diaCelula) {
            mostrarErro('cellDay', 'Selecione o dia da célula');
            valido = false;
          }

          if (!horarioCelula) {
            mostrarErro('cellTime', 'Informe o horário da célula');
            valido = false;
          }

          if (!tiposCelula.length) {
            mostrarErro('cellTypes', 'Selecione ao menos um tipo da célula');
            valido = false;
          }

          if (!ruaCelula) {
            mostrarErro('cellStreet', 'Informe a rua da célula');
            valido = false;
          }

          if (!numeroEnderecoCelula) {
            mostrarErro('cellAddressNumber', 'Informe o número da célula');
            valido = false;
          }

          if (!bairroCelula) {
            mostrarErro('cellAddressNeighborhood', 'Informe o bairro da célula');
            valido = false;
          }

          if (!cidadeCelula) {
            mostrarErro('cellAddressCity', 'Informe a cidade da célula');
            valido = false;
          }
        }

        if (!emEdicao) {
          const nomeNovo = fullName.toLowerCase();
          const nascimentoNovo = birthDate;
          const existeDuplicata = ModoVisual.membros().some(m =>
            (m.fullName || '').toLowerCase() === nomeNovo &&
            (m.birthDate || '').slice(0, 10) === nascimentoNovo
          );
          if (existeDuplicata) {
            const confirmou = confirm('Já existe um membro com este nome e data de nascimento. Deseja continuar mesmo assim?');
            if (!confirmou) {
              valido = false;
            }
          }
        }

        return valido;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!validarFormulario()) {
          return;
        }

        try {
          DOM.desabilitarBotao(btnEnviar);
          spinner.style.display = 'flex';
          btnTexto.textContent = 'Criando...';

          const dados = {
            fullName: document.getElementById('fullName').value.trim(),
            birthDate: document.getElementById('birthDate').value,
            joinDate: document.getElementById('joinDate').value,
            joinType: document.getElementById('joinType').value,
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim() || null,
            addressStreet: document.getElementById('addressStreet').value.trim(),
            addressNumber: document.getElementById('addressNumber').value.trim(),
            addressComplement: document.getElementById('addressComplement').value.trim() || null,
            addressNeighborhood: document.getElementById('addressNeighborhood').value.trim(),
            addressCity: document.getElementById('addressCity').value.trim(),
            leaderId: document.getElementById('leaderId').value,
            category: document.getElementById('category').value,
            isCellLeader: isCellLeaderSwitch.value === 'sim'
          };

          const celulaDoLider = celulasDisponiveis.find(c => c.leaderId === dados.leaderId || c.leader?.id === dados.leaderId);
          if (celulaDoLider) {
            dados.cellId = celulaDoLider.id;
          } else if (emEdicao && membroEmEdicao?.cellId) {
            dados.cellId = membroEmEdicao.cellId;
          }

          if (emEdicao) {
            await MembrosApi.atualizar(membroId, dados);

            if (dados.isCellLeader) {
              const numeroCelula = DOM.obter('#cellNumber').value.trim() || '1';
              const payloadCelula = {
                name: `${dados.fullName} - Célula ${numeroCelula}`,
                audience: 'todas',
                meetingDay: Number(DOM.obter('#cellDay').value),
                meetingTime: `${DOM.obter('#cellTime').value}:00`,
                neighborhood: DOM.obter('#cellAddressNeighborhood').value.trim(),
                city: DOM.obter('#cellAddressCity').value.trim(),
                street: DOM.obter('#cellStreet').value.trim(),
                number: DOM.obter('#cellAddressNumber').value.trim(),
                complement: DOM.obter('#cellAddressComplement').value.trim() || null,
                types: Array.from(DOM.obter('#cellTypes').selectedOptions).map(x => x.value),
                leaderId: membroId
              };

              if (celulaDoMembroEmEdicao) {
                await CelulasApi.atualizar(celulaDoMembroEmEdicao.id, payloadCelula);
              } else {
                const novaCelula = await CelulasApi.criar(payloadCelula);
                await MembrosApi.atualizar(membroId, { cellId: novaCelula.id });
              }
            }

            btnTexto.textContent = 'Salvo';
            Notificacao.sucesso('Membro atualizado com sucesso');
          } else {
            const membroCriado = await MembrosApi.criar(dados);

            if (dados.isCellLeader) {
              const numeroCelula = DOM.obter('#cellNumber').value.trim() || '1';
              const payloadCelula = {
                name: `${dados.fullName} - Célula ${numeroCelula}`,
                audience: 'todas',
                meetingDay: Number(DOM.obter('#cellDay').value),
                meetingTime: `${DOM.obter('#cellTime').value}:00`,
                neighborhood: DOM.obter('#cellAddressNeighborhood').value.trim(),
                city: DOM.obter('#cellAddressCity').value.trim(),
                street: DOM.obter('#cellStreet').value.trim(),
                number: DOM.obter('#cellAddressNumber').value.trim(),
                complement: DOM.obter('#cellAddressComplement').value.trim() || null,
                types: Array.from(DOM.obter('#cellTypes').selectedOptions).map(x => x.value),
                leaderId: membroCriado.id
              };

              const celulaCriada = await CelulasApi.criar(payloadCelula);
              await MembrosApi.atualizar(membroCriado.id, { cellId: celulaCriada.id });
            }

            btnTexto.textContent = 'Sucesso';
            Notificacao.sucesso('Membro criado com sucesso');
          }

          setTimeout(() => {
            window.location.href = '/membros.html';
          }, 1000);

        } catch (erro) {
          spinner.style.display = 'none';
          btnTexto.textContent = emEdicao ? 'Salvar Alterações' : 'Criar Membro';
          DOM.habilitarBotao(btnEnviar);

          const mensagem = erro.mensagem || erro.message || 'Erro ao criar membro';
          Notificacao.erro(mensagem);
          console.error('Erro:', erro);
        }
      });

      carregarSelects().then(carregarMembroParaEdicao);
      alternarCamposLider();
  </script>
