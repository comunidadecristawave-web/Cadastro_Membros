<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Célula - Cadastro de Membros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imagens/IMG_2261.PNG">
  <style>
    .detalhe-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }

    .detalhe-content {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--espaco-xl) var(--espaco-md);
    }

    .detalhe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--espaco-md);
      margin-bottom: var(--espaco-xl);
      flex-wrap: wrap;
    }

    .detalhe-header h1 {
      margin: 0;
      font-size: var(--fonte-tamanho-xl);
      color: var(--cor-fundo-dark);
    }

    .detalhe-card {
      background: var(--cor-fundo);
      border-radius: var(--raio-lg);
      box-shadow: var(--sombra-md);
      padding: var(--espaco-xl);
    }

    .detalhe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-lg);
    }

    .detalhe-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: var(--raio-md);
      padding: var(--espaco-md);
    }

    .detalhe-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--cor-texto-light);
      margin-bottom: 4px;
      font-weight: var(--fonte-peso-semibold);
    }

    .detalhe-valor {
      color: var(--cor-fundo-dark);
      font-weight: var(--fonte-peso-medium);
    }

    .acoes {
      margin-top: var(--espaco-xl);
      display: flex;
      gap: var(--espaco-sm);
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: var(--raio-md);
      padding: var(--espaco-sm) var(--espaco-md);
      font-weight: var(--fonte-peso-medium);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transicao-rapida);
    }

    .btn-primario {
      background: var(--cor-primaria);
      color: var(--cor-fundo);
    }

    .btn-primario:hover {
      background: var(--cor-primaria-dark);
    }

    .btn-neutro {
      background: #eef2f7;
      color: #1f2937;
    }

    .btn-neutro:hover {
      background: #e2e8f0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-md);
      margin-top: var(--espaco-lg);
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .grupo-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grupo-form label {
      font-size: 13px;
      color: var(--cor-texto);
      font-weight: var(--fonte-peso-semibold);
    }

    .grupo-form input,
    .grupo-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
      font-family: var(--fonte-principal);
    }

    .oculto {
      display: none;
    }

    .arvore-container {
      display: flex;
      flex-direction: column;
      gap: var(--espaco-md);
      margin-bottom: var(--espaco-xl);
    }

    .arvore-nivel {
      display: flex;
      justify-content: center;
      gap: var(--espaco-md);
      flex-wrap: wrap;
    }

    .arvore-no {
      min-width: 180px;
      max-width: 240px;
      background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
      border: 1px solid #95d5b2;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: var(--sombra-sm);
    }

    .arvore-no.raiz {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      border-color: #93c5fd;
      font-weight: var(--fonte-peso-semibold);
    }

    .arvore-no-nome {
      font-size: 14px;
      color: var(--cor-fundo-dark);
      font-weight: var(--fonte-peso-semibold);
      margin-bottom: 4px;
    }

    .arvore-no-meta {
      font-size: 12px;
      color: var(--cor-texto-light);
    }

    .arvore-conector {
      width: 2px;
      height: 22px;
      margin: 0 auto;
      background: #cbd5e1;
      border-radius: 999px;
    }

    .secao-celulas-lider {
      border-top: 1px solid var(--cor-borda);
      padding-top: var(--espaco-lg);
      margin-top: var(--espaco-lg);
    }

    .celula-mini-card {
      border: 1px solid var(--cor-borda);
      background: #f8fafc;
      border-radius: var(--raio-md);
      padding: var(--espaco-md);
      margin-bottom: var(--espaco-sm);
    }

    @media (max-width: 768px) {
      .detalhe-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <a class="navbar-brand" href="/dashboard.html">WAVE</a>
      <button class="navbar-hamburger" id="btnHamburger" aria-label="Abrir menu" style="display:none">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
      <div class="navbar-user">
        <span id="nomeUsuario">Carregando...</span>
        <button class="btn-logout">Sair</button>
      </div>
    </div>
    <div class="navbar-mobile-overlay" id="navbarMobileOverlay" style="display:none">
      <div class="navbar-mobile-menu">
        <button class="navbar-mobile-close" id="btnCloseMobileMenu" aria-label="Fechar menu">✕</button>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
      </div>
    </div>
    <style>
      @media (max-width: 900px) {
        .navbar-menu {
          display: none !important;
        }
        .navbar-hamburger {
          display: block !important;
          background: none;
          border: none;
          margin-left: auto;
          cursor: pointer;
          padding: 6px;
        }
        .navbar-mobile-overlay {
          display: none;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.7);
          z-index: 2000;
          align-items: flex-start;
          justify-content: flex-end;
        }
        .navbar-mobile-overlay.ativo {
          display: flex !important;
        }
        .navbar-mobile-menu {
          background: var(--cor-fundo-dark);
          color: var(--cor-fundo);
          width: 220px;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          gap: var(--espaco-lg);
          padding: var(--espaco-xl) var(--espaco-lg) var(--espaco-lg) var(--espaco-lg);
          box-shadow: -2px 0 12px rgba(0,0,0,0.2);
          position: relative;
        }
        .navbar-mobile-menu a {
          color: var(--cor-fundo);
          font-size: var(--fonte-tamanho-lg);
          font-weight: var(--fonte-peso-semibold);
          text-decoration: none;
          padding: var(--espaco-md) 0;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .navbar-mobile-close {
          position: absolute;
          top: var(--espaco-md);
          right: var(--espaco-md);
          background: none;
          border: none;
          color: var(--cor-fundo);
          font-size: 28px;
          cursor: pointer;
        }
      }
    </style>
    <script>
      // Menu hambúrguer mobile
      const btnHamburger = document.getElementById('btnHamburger');
      const navbarMobileOverlay = document.getElementById('navbarMobileOverlay');
      const btnCloseMobileMenu = document.getElementById('btnCloseMobileMenu');
      function abrirMenuMobile() {
        navbarMobileOverlay.classList.add('ativo');
        navbarMobileOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function fecharMenuMobile() {
        navbarMobileOverlay.classList.remove('ativo');
        navbarMobileOverlay.style.display = 'none';
        document.body.style.overflow = '';
      }
      btnHamburger.addEventListener('click', abrirMenuMobile);
      btnCloseMobileMenu.addEventListener('click', fecharMenuMobile);
      navbarMobileOverlay.addEventListener('click', function(e) {
        if (e.target === navbarMobileOverlay) fecharMenuMobile();
      });
      // Mostrar botão só no mobile
      function toggleHamburger() {
        if (window.innerWidth <= 900) {
          btnHamburger.style.display = 'block';
        } else {
          btnHamburger.style.display = 'none';
          fecharMenuMobile();
        }
      }
      window.addEventListener('resize', toggleHamburger);
      toggleHamburger();
    </script>
  </nav>

  <div class="detalhe-container">
    <div class="detalhe-content">
      <div class="detalhe-header">
        <h1 id="tituloCelula">Visualizar Célula</h1>
        <a href="/membros.html" class="btn btn-neutro">Voltar</a>
      </div>

      <div class="detalhe-card" id="cardCelula">
        <div class="loading-state" id="loading" style="display:block; text-align:center;">
          <div class="spinner"></div>
          <p style="margin-top: var(--espaco-md); color: var(--cor-texto-light);">Carregando dados...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    if (!protegerRota()) throw new Error('Não autenticado');

    const params = new URLSearchParams(window.location.search);
    const celulaId = params.get('id');
    const liderId = params.get('liderId');
    const emEdicao = params.get('editar') === '1';
    const cardCelula = DOM.obter('#cardCelula');
    const tituloCelula = DOM.obter('#tituloCelula');
    const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

    function valor(v) {
      return v ? v : '—';
    }

    function publicoLabel(audience) {
      if (audience === 'homens') return 'Homens';
      if (audience === 'mulheres') return 'Mulheres';
      return 'Geral';
    }

    async function salvarEdicao(form, celula) {
      const dados = {
        name: form.name.value.trim(),
        audience: form.audience.value,
        meetingDay: Number(form.meetingDay.value),
        meetingTime: form.meetingTime.value,
        neighborhood: form.neighborhood.value.trim(),
        city: form.city.value.trim(),
        street: form.street.value.trim(),
        number: form.number.value.trim(),
        complement: form.complement.value.trim(),
        leaderId: celula.leaderId
      };

      if (!dados.name || !dados.meetingTime || !dados.street || !dados.number || !dados.neighborhood || !dados.city) {
        Notificacao.aviso('Preencha os campos obrigatórios');
        return;
      }

      try {
        await CelulasApi.atualizar(celula.id, dados);
        Notificacao.sucesso('Célula atualizada com sucesso');
        setTimeout(() => {
          window.location.href = `/visualizar-celula.html?id=${celula.id}`;
        }, 700);
      } catch (erro) {
        console.error(erro);
        Notificacao.erro('Erro ao atualizar célula');
      }
    }

    async function carregar() {
      try {
        if (!celulaId && liderId) {
          const [celulasResp, membrosResp] = await Promise.all([
            CelulasApi.listar(1, 500),
            MembrosApi.listar(1, 500, {})
          ]);

          const membros = membrosResp.items || [];
          const celulasLider = (celulasResp.items || []).filter(x => x.leaderId === liderId || x.leader?.id === liderId);
          const lider = membros.find(x => x.id === liderId);

          const filhosPorLider = new Map();
          membros.forEach(membro => {
            if (!membro.leaderId) return;
            if (!filhosPorLider.has(membro.leaderId)) {
              filhosPorLider.set(membro.leaderId, []);
            }
            filhosPorLider.get(membro.leaderId).push(membro);
          });

          const niveis = [];
          const visitados = new Set();
          let nivelAtual = lider ? [lider] : [];

          while (nivelAtual.length > 0) {
            const nivelUnico = nivelAtual.filter(x => {
              if (!x || visitados.has(x.id)) return false;
              visitados.add(x.id);
              return true;
            });

            if (nivelUnico.length === 0) break;
            niveis.push(nivelUnico);

            const proximoNivel = [];
            nivelUnico.forEach(membro => {
              const filhos = filhosPorLider.get(membro.id) || [];
              proximoNivel.push(...filhos);
            });
            nivelAtual = proximoNivel;
          }

          tituloCelula.textContent = `Células de ${lider?.fullName || 'Líder'}`;

          if (celulasLider.length === 0) {
            cardCelula.innerHTML = `
              <div class="vazio" style="text-align:center; padding: 30px 10px; color: var(--cor-texto-light);">
                Nenhuma célula vinculada a este líder.
              </div>
            `;
            return;
          }

          const arvoreHtml = niveis.length > 0
            ? `<div class="arvore-container">${niveis.map((nivel, idx) => {
                const cards = nivel.map(membro => `
                  <div class="arvore-no ${idx === 0 ? 'raiz' : ''}">
                    <div class="arvore-no-nome">${membro.fullName || 'Sem nome'}</div>
                    <div class="arvore-no-meta">${membro.category || 'Sem categoria'}</div>
                  </div>
                `).join('');
                const conector = idx < (niveis.length - 1) ? '<div class="arvore-conector"></div>' : '';
                return `<div class="arvore-nivel">${cards}</div>${conector}`;
              }).join('')}</div>`
            : '<div class="vazio" style="text-align:center; color: var(--cor-texto-light);">Sem dados de discipulado para este líder.</div>';

          const celulasResumoHtml = celulasLider.map(celula => {
            const categoriaCelula = Array.isArray(celula.types) && celula.types.length > 0
              ? celula.types.join(', ')
              : 'Nao definida';
            return `
              <div class="celula-mini-card">
                <div><strong>${valor(celula.name)}</strong></div>
                <div>${diasSemana[Number(celula.meetingDay) || 0]} às ${(celula.meetingTime || '').slice(0, 5)}</div>
                <div>Categoria: ${categoriaCelula}</div>
                <div>Endereço: ${valor(celula.street)} ${valor(celula.number)} ${celula.complement ? '- ' + celula.complement : ''}</div>
                <div class="acoes" style="margin-top: 8px;">
                  <a class="btn btn-primario" href="/visualizar-celula.html?id=${celula.id}&editar=1">Editar Célula</a>
                </div>
              </div>
            `;
          }).join('');

          cardCelula.innerHTML = `
            ${arvoreHtml}
            <div class="secao-celulas-lider">
              <h3 style="margin-top: 0;">Células do líder</h3>
              ${celulasResumoHtml}
            </div>
            <div class="acoes"><a class="btn btn-neutro" href="/membros.html">Voltar para lista</a></div>
          `;

          return;
        }

        if (!celulaId) {
          Notificacao.aviso('Célula não informada');
          window.location.href = '/membros.html';
          return;
        }

        const celula = await CelulasApi.obter(celulaId);

        if (!celula) {
          Notificacao.aviso('Célula não encontrada');
          window.location.href = '/membros.html';
          return;
        }

        const membrosResp = await MembrosApi.listar(1, 500, {});
        const membros = membrosResp.items || [];
        const discipulos = membros.filter(x => x.cellId === celula.id && x.id !== celula.leaderId);
        const categoriasDiscipulos = Array.from(new Set(discipulos.map(x => x.category).filter(Boolean)));
        const categoriaCelula = Array.isArray(celula.types) && celula.types.length > 0
          ? celula.types.join(', ')
          : (categoriasDiscipulos.length > 0 ? categoriasDiscipulos.join(', ') : 'Nao definida');

        const discipulosHtml = discipulos.length > 0
          ? `<ul style="margin: 0; padding-left: 18px;">${discipulos.map(x => `<li>${x.fullName || 'Sem nome'}</li>`).join('')}</ul>`
          : '<span>Nenhum discípulo vinculado</span>';

        tituloCelula.textContent = emEdicao ? 'Editar Célula' : (celula.name || 'Visualizar Célula');

        if (!emEdicao) {
          cardCelula.innerHTML = `
            <div class="detalhe-grid">
              <div class="detalhe-item">
                <div class="detalhe-label">Identificação</div>
                <div class="detalhe-valor">${valor(celula.name)}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Público principal</div>
                <div class="detalhe-valor">${publicoLabel(celula.audience)}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Líder</div>
                <div class="detalhe-valor">${valor(celula.leader?.fullName)}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Dia e horário</div>
                <div class="detalhe-valor">${diasSemana[Number(celula.meetingDay) || 0]} às ${(celula.meetingTime || '').slice(0, 5)}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Categoria</div>
                <div class="detalhe-valor">${categoriaCelula}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Bairro</div>
                <div class="detalhe-valor">${valor(celula.neighborhood)}</div>
              </div>
              <div class="detalhe-item">
                <div class="detalhe-label">Cidade</div>
                <div class="detalhe-valor">${valor(celula.city)}</div>
              </div>
              <div class="detalhe-item" style="grid-column: 1 / -1;">
                <div class="detalhe-label">Endereço</div>
                <div class="detalhe-valor">${valor(celula.street)} ${valor(celula.number)} ${celula.complement ? '- ' + celula.complement : ''}</div>
              </div>
              <div class="detalhe-item" style="grid-column: 1 / -1;">
                <div class="detalhe-label">Discípulos</div>
                <div class="detalhe-valor">${discipulosHtml}</div>
              </div>
            </div>
            <div class="acoes">
              <a class="btn btn-primario" href="/visualizar-celula.html?id=${celula.id}&editar=1">Editar Célula</a>
              <a class="btn btn-neutro" href="/membros.html">Voltar para lista</a>
            </div>
          `;
          return;
        }

        cardCelula.innerHTML = `
          <form id="formEditarCelula">
            <div class="form-grid">
              <div class="grupo-form full">
                <label for="name">Identificação da célula</label>
                <input id="name" name="name" value="${celula.name || ''}" required>
              </div>
              <div class="grupo-form">
                <label for="audience">Público principal</label>
                <select id="audience" name="audience" required>
                  <option value="homens" ${celula.audience === 'homens' ? 'selected' : ''}>Homens</option>
                  <option value="mulheres" ${celula.audience === 'mulheres' ? 'selected' : ''}>Mulheres</option>
                </select>
              </div>
              <div class="grupo-form">
                <label for="meetingDay">Dia da semana</label>
                <select id="meetingDay" name="meetingDay" required>
                  <option value="1" ${Number(celula.meetingDay) === 1 ? 'selected' : ''}>Segunda</option>
                  <option value="2" ${Number(celula.meetingDay) === 2 ? 'selected' : ''}>Terça</option>
                  <option value="3" ${Number(celula.meetingDay) === 3 ? 'selected' : ''}>Quarta</option>
                  <option value="4" ${Number(celula.meetingDay) === 4 ? 'selected' : ''}>Quinta</option>
                  <option value="5" ${Number(celula.meetingDay) === 5 ? 'selected' : ''}>Sexta</option>
                  <option value="6" ${Number(celula.meetingDay) === 6 ? 'selected' : ''}>Sábado</option>
                  <option value="0" ${Number(celula.meetingDay) === 0 ? 'selected' : ''}>Domingo</option>
                </select>
              </div>
              <div class="grupo-form">
                <label for="meetingTime">Horário</label>
                <input id="meetingTime" name="meetingTime" type="time" value="${(celula.meetingTime || '').slice(0, 5)}" required>
              </div>
              <div class="grupo-form">
                <label for="street">Rua</label>
                <input id="street" name="street" value="${celula.street || ''}" required>
              </div>
              <div class="grupo-form">
                <label for="number">Número</label>
                <input id="number" name="number" value="${celula.number || ''}" required>
              </div>
              <div class="grupo-form full">
                <label for="complement">Complemento</label>
                <input id="complement" name="complement" value="${celula.complement || ''}">
              </div>
              <div class="grupo-form">
                <label for="neighborhood">Bairro</label>
                <input id="neighborhood" name="neighborhood" value="${celula.neighborhood || ''}" required>
              </div>
              <div class="grupo-form">
                <label for="city">Cidade</label>
                <input id="city" name="city" value="${celula.city || ''}" required>
              </div>
            </div>
            <div class="acoes">
              <button type="submit" class="btn btn-primario">Salvar alterações</button>
              <a class="btn btn-neutro" href="/visualizar-celula.html?id=${celula.id}">Cancelar</a>
            </div>
          </form>
        `;

        const form = DOM.obter('#formEditarCelula');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          salvarEdicao(form, celula);
        });
      } catch (erro) {
        console.error(erro);
        Notificacao.erro('Erro ao carregar célula');
      }
    }

    carregar();
  </script>
</body>
</html>
