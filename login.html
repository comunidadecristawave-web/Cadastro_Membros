<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cadastro de Membros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imagens/IMG_2261.PNG">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .login-container::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--espaco-lg);
      position: relative;
      z-index: 1;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--cor-fundo);
      border-radius: var(--raio-lg);
      padding: var(--espaco-2xl);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--espaco-xl);
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto var(--espaco-md);
      border-radius: 20px;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.15);
      padding: 12px;
      overflow: hidden;
      animation: bounce 2s infinite;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin-bottom: var(--espaco-md);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .login-header h1 {
      font-size: var(--fonte-tamanho-2xl);
      color: var(--cor-fundo-dark);
      margin-bottom: var(--espaco-sm);
    }

    .login-header p {
      color: var(--cor-texto-light);
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: var(--espaco-lg);
    }

    .form-group label {
      display: block;
      margin-bottom: var(--espaco-sm);
      font-weight: var(--fonte-peso-semibold);
      color: var(--cor-texto);
    }

    .form-group input {
      width: 100%;
      padding: 12px var(--espaco-md);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
      font-size: var(--fonte-tamanho-base);
      transition: all var(--transicao-rapida);
      background-color: var(--cor-fundo-alt);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--cor-primaria);
      background-color: var(--cor-fundo);
      box-shadow: 0 0 0 4px var(--cor-primaria-light);
      transform: scale(1.02);
    }

    .form-group input::placeholder {
      color: var(--cor-texto-light);
    }

    .form-group .erro {
      display: none;
      color: var(--cor-erro);
      font-size: var(--fonte-tamanho-sm);
      margin-top: var(--espaco-xs);
      animation: shake 0.3s ease-in-out;
    }

    .form-group.invalido input {
      border-color: var(--cor-erro);
    }

    .form-group.invalido .erro {
      display: block;
    }

    .loading-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: var(--espaco-sm);
    }

    .btn-login {
      width: 100%;
      padding: 12px var(--espaco-lg);
      background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-primaria-dark) 100%);
      color: var(--cor-fundo);
      border: none;
      border-radius: var(--raio-md);
      font-size: var(--fonte-tamanho-base);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
      transition: all var(--transicao-rapida);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: var(--espaco-lg);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 102, 204, 0.3);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    .btn-visual {
      width: 100%;
      margin-top: var(--espaco-md);
      padding: 12px var(--espaco-lg);
      background: var(--cor-fundo-alt);
      color: var(--cor-fundo-dark);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
      font-size: var(--fonte-tamanho-base);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
      transition: all var(--transicao-rapida);
    }

    .btn-visual:hover {
      border-color: var(--cor-primaria);
      color: var(--cor-primaria-dark);
      transform: translateY(-1px);
    }

    .login-footer {
      text-align: center;
      margin-top: var(--espaco-xl);
      padding-top: var(--espaco-lg);
      border-top: 1px solid var(--cor-borda);
    }

    .login-footer p {
      font-size: var(--fonte-tamanho-sm);
      color: var(--cor-texto-light);
      margin-bottom: 0;
    }

    .demo-info {
      background: var(--cor-primaria-light);
      border-left: 4px solid var(--cor-primaria);
      padding: var(--espaco-md);
      border-radius: var(--raio-md);
      margin-bottom: var(--espaco-lg);
      font-size: var(--fonte-tamanho-sm);
      color: var(--cor-primaria-dark);
    }

    .demo-info code {
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }

    .alerta-container {
      margin-bottom: var(--espaco-lg);
    }

    @media (max-width: 600px) {
      .login-box {
        padding: var(--espaco-lg);
      }

      .login-header h1 {
        font-size: var(--fonte-tamanho-xl);
      }

      .logo {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-wrapper">
      <div class="login-box">
        <div class="login-header">
          <div class="logo">
            <img src="imagens/Logo-Wave-Vertical.png" alt="WAVE">
          </div>
          <h1>WAVE</h1>
          <p>Cadastro de Membros</p>
        </div>

        <div class="alerta-container"></div>

        <div class="demo-info">
          <strong>Dados de demonstração:</strong><br>
          Email: <code>admin@onda.com</code><br>
          Senha: <code>TroqueEssaSenha123!</code>
        </div>

        <form id="formLogin" class="formulario">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="seu.email@exemplo.com" 
              required
              autocomplete="email"
            >
            <div class="erro" data-erro="email"></div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input 
              type="password" 
              id="senha" 
              name="senha" 
              placeholder="Digite sua senha" 
              required
              autocomplete="current-password"
            >
            <div class="erro" data-erro="senha"></div>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <span class="loading-spinner" id="spinner"></span>
            <span id="btnTexto">Entrar</span>
          </button>

          <button type="button" class="btn-visual" id="btnModoVisual">
            Entrar em modo visual (sem API)
          </button>
        </form>

        <div class="login-footer">
          <p>© 2026 Comunidade WAVE. Todos os direitos reservados.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    // Proteger página - redirecionar se já autenticado
    rotaPublica();

    const formLogin = DOM.obter('#formLogin');
    const btnLogin = DOM.obter('#btnLogin');
    const spinner = DOM.obter('#spinner');
    const btnTexto = DOM.obter('#btnTexto');
    const btnModoVisual = DOM.obter('#btnModoVisual');
    const alertaContainer = DOM.obter('.alerta-container');

    btnModoVisual.addEventListener('click', () => {
      ModoVisual.ativar();
      const usuario = {
        id: '00000000-0000-0000-0000-000000000001',
        fullName: 'Administrador Demo',
        email: 'demo@wave.local',
        role: 'Admin',
        tenantId: '00000000-0000-0000-0000-000000000100'
      };

      TokenManager.salvarToken('demo-token', 720);
      UsuarioManager.salvarUsuario(usuario);
      window.location.href = '/dashboard.html';
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Limpar erros anteriores
      document.querySelectorAll('.form-group').forEach(g => g.classList.remove('invalido'));

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      // Validação básica
      if (!Validador.email(email)) {
        mostrarErro('email', 'Email inválido');
        return;
      }

      if (!Validador.obrigatorio(senha)) {
        mostrarErro('senha', 'Senha obrigatória');
        return;
      }

      try {
        DOM.desabilitarBotao(btnLogin);
        spinner.style.display = 'flex';
        btnTexto.textContent = 'Entrando...';

        const resposta = await AuthApi.login(email, senha);

        // Salvar token e usuário
        TokenManager.salvarToken(resposta.accessToken, resposta.expiresInMinutes);
        UsuarioManager.salvarUsuario(resposta.user);

        // Mostrar sucesso com animação
        btnTexto.textContent = 'Sucesso';
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);

      } catch (erro) {
        spinner.style.display = 'none';
        btnTexto.textContent = 'Entrar';
        DOM.habilitarBotao(btnLogin);

        const mensagem = erro.mensagem || 'Erro ao fazer login. Verifique suas credenciais.';
        mostrarAlerta(mensagem, 'erro');

        console.error('Erro login:', erro);
      }
    });

    function mostrarErro(campo, mensagem) {
      const formGroup = document.getElementById(campo).parentElement;
      formGroup.classList.add('invalido');
      formGroup.querySelector('.erro').textContent = mensagem;
    }

    function mostrarAlerta(mensagem, tipo) {
      DOM.limpar(alertaContainer);
      const alerta = DOM.criar('div', { className: `alerta alerta-${tipo}` }, mensagem);
      alertaContainer.appendChild(alerta);
    }

    // Enter para enviar
    document.getElementById('email').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') formLogin.dispatchEvent(new Event('submit'));
    });
    document.getElementById('senha').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') formLogin.dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
