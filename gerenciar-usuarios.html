<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração de Usuários - Cadastro de Membros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imagens/IMG_2261.PNG">
  <style>
    .usuarios-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }

    .usuarios-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--espaco-xl) var(--espaco-md);
    }

    .usuarios-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--espaco-md);
      flex-wrap: wrap;
      margin-bottom: var(--espaco-lg);
    }

    .usuarios-header h1 {
      color: var(--cor-fundo-dark);
      margin: 0;
    }

    .btn-novo-usuario {
      border: none;
      border-radius: var(--raio-md);
      padding: var(--espaco-sm) var(--espaco-md);
      cursor: pointer;
      font-weight: var(--fonte-peso-semibold);
      background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-primaria-dark) 100%);
      color: #fff;
    }

    .filtro-status-wrap {
      margin-bottom: var(--espaco-md);
      display: flex;
      align-items: center;
      gap: var(--espaco-sm);
    }

    .filtro-status-wrap select {
      padding: var(--espaco-sm) var(--espaco-md);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
    }

    .tabela-container {
      background: #fff;
      border-radius: var(--raio-lg);
      box-shadow: var(--sombra-md);
      overflow: hidden;
    }

    .tabela {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    .tabela thead {
      background: linear-gradient(135deg, var(--cor-fundo-dark) 0%, #2d2d2d 100%);
      color: #fff;
    }

    .tabela th,
    .tabela td {
      padding: var(--espaco-md);
      text-align: left;
      border-bottom: 1px solid var(--cor-borda);
      font-size: var(--fonte-tamanho-sm);
    }

    .tabela th button {
      all: unset;
      cursor: pointer;
      font-weight: var(--fonte-peso-semibold);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-pill {
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: var(--fonte-peso-semibold);
      font-size: 12px;
      display: inline-block;
    }

    .status-ativo {
      background: #d1fae5;
      color: #065f46;
    }

    .status-inativo {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .acoes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-acao {
      border: none;
      border-radius: var(--raio-md);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
    }

    .btn-editar { background: #1d4ed8; color: #fff; }
    .btn-inativar { background: #b91c1c; color: #fff; }
    .btn-reativar { background: #0f766e; color: #fff; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2300;
      padding: var(--espaco-md);
    }

    .modal-overlay.ativo { display: flex; }

    .modal-card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: var(--raio-lg);
      padding: var(--espaco-lg);
      box-shadow: var(--sombra-lg);
    }

    .form-grid {
      display: grid;
      gap: var(--espaco-sm);
      margin: var(--espaco-md) 0;
    }

    .form-grid label {
      font-size: var(--fonte-tamanho-sm);
      font-weight: var(--fonte-peso-semibold);
      color: var(--cor-fundo-dark);
    }

    .form-grid input {
      padding: var(--espaco-sm) var(--espaco-md);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-md);
    }

    .campo-erro {
      border-color: #ef4444 !important;
    }

    .erro-texto {
      color: #b91c1c;
      font-size: 12px;
      min-height: 16px;
    }

    .modal-acoes {
      display: flex;
      justify-content: flex-end;
      gap: var(--espaco-sm);
      border-top: 1px solid var(--cor-borda);
      padding-top: var(--espaco-md);
    }

    .modal-btn {
      border: none;
      border-radius: var(--raio-md);
      padding: var(--espaco-sm) var(--espaco-md);
      font-weight: var(--fonte-peso-semibold);
      cursor: pointer;
    }

    .modal-btn.secundario { background: #e2e8f0; color: #334155; }
    .modal-btn.primario { background: var(--cor-primaria); color: #fff; }

    .vazio {
      padding: var(--espaco-xl);
      text-align: center;
      color: var(--cor-texto-light);
    }

    @media (max-width: 900px) {
      .navbar-menu {
        display: none !important;
      }

      .navbar-hamburger {
        display: block !important;
        background: none;
        border: none;
        margin-left: auto;
        cursor: pointer;
        padding: 6px;
      }

      .navbar-mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 2000;
        align-items: flex-start;
        justify-content: flex-end;
      }

      .navbar-mobile-overlay.ativo {
        display: flex !important;
      }

      .navbar-mobile-menu {
        background: var(--cor-fundo-dark);
        color: var(--cor-fundo);
        width: 220px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: var(--espaco-lg);
        padding: var(--espaco-xl) var(--espaco-lg) var(--espaco-lg) var(--espaco-lg);
        box-shadow: -2px 0 12px rgba(0,0,0,0.2);
        position: relative;
      }

      .navbar-mobile-menu a {
        color: var(--cor-fundo);
        font-size: var(--fonte-tamanho-lg);
        font-weight: var(--fonte-peso-semibold);
        text-decoration: none;
        padding: var(--espaco-md) 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .navbar-mobile-close {
        position: absolute;
        top: var(--espaco-md);
        right: var(--espaco-md);
        background: none;
        border: none;
        color: var(--cor-fundo);
        font-size: 28px;
        cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <a class="navbar-brand" href="/dashboard.html">WAVE</a>
      <button class="navbar-hamburger" id="btnHamburger" aria-label="Abrir menu" style="display:none">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
        <a href="/gerenciar-usuarios.html">Administração</a>
      </div>
      <div class="navbar-user">
        <span id="nomeUsuario">Carregando...</span>
        <button class="btn-logout">Sair</button>
      </div>
    </div>
    <div class="navbar-mobile-overlay" id="navbarMobileOverlay" style="display:none">
      <div class="navbar-mobile-menu">
        <button class="navbar-mobile-close" id="btnCloseMobileMenu" aria-label="Fechar menu">✕</button>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/membros.html">Membros</a>
        <a href="/importacao.html">Importar CSV</a>
        <a href="/gerenciar-usuarios.html">Administração</a>
      </div>
    </div>
  </nav>

  <div class="usuarios-container">
    <div class="usuarios-content">
      <div class="usuarios-header">
        <h1>Administração de Usuários</h1>
        <button class="btn-novo-usuario" id="btnNovoUsuario">Novo Usuário</button>
      </div>

      <div class="filtro-status-wrap">
        <label for="filtroStatus">Status:</label>
        <select id="filtroStatus">
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
          <option value="todos">Todos</option>
        </select>
      </div>

      <div class="tabela-container">
        <div style="overflow:auto;">
          <table class="tabela">
            <thead>
              <tr>
                <th><button type="button" data-sort="fullName">Nome</button></th>
                <th><button type="button" data-sort="email">E-mail</button></th>
                <th><button type="button" data-sort="isActive">Status</button></th>
                <th><button type="button" data-sort="createdAt">Criado em</button></th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaUsuarios"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalUsuario">
    <div class="modal-card">
      <h3 id="tituloModalUsuario">Novo usuário</h3>
      <div class="form-grid">
        <label for="inputNome">Nome completo</label>
        <input type="text" id="inputNome" maxlength="150">

        <label for="inputEmail">E-mail</label>
        <input type="email" id="inputEmail" maxlength="150">
        <div class="erro-texto" id="erroEmail"></div>

        <div id="blocoSenhaTemporaria">
          <label for="inputSenha">Senha temporária</label>
          <input type="password" id="inputSenha" maxlength="80">
          <div class="erro-texto" id="erroSenha"></div>
        </div>
      </div>
      <div class="modal-acoes">
        <button type="button" class="modal-btn secundario" id="btnCancelarModalUsuario">Cancelar</button>
        <button type="button" class="modal-btn primario" id="btnSalvarUsuario">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalConfirmacao">
    <div class="modal-card">
      <h3 id="tituloConfirmacao">Confirmar ação</h3>
      <p id="textoConfirmacao"></p>
      <div class="modal-acoes">
        <button type="button" class="modal-btn secundario" id="btnCancelarConfirmacao">Cancelar</button>
        <button type="button" class="modal-btn primario" id="btnExecutarConfirmacao">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    if (!protegerRota()) throw new Error('Não autenticado');

    const tabelaUsuarios = document.getElementById('tabelaUsuarios');
    const filtroStatus = document.getElementById('filtroStatus');
    const btnNovoUsuario = document.getElementById('btnNovoUsuario');

    const modalUsuario = document.getElementById('modalUsuario');
    const tituloModalUsuario = document.getElementById('tituloModalUsuario');
    const inputNome = document.getElementById('inputNome');
    const inputEmail = document.getElementById('inputEmail');
    const inputSenha = document.getElementById('inputSenha');
    const blocoSenhaTemporaria = document.getElementById('blocoSenhaTemporaria');
    const erroEmail = document.getElementById('erroEmail');
    const erroSenha = document.getElementById('erroSenha');
    const btnCancelarModalUsuario = document.getElementById('btnCancelarModalUsuario');
    const btnSalvarUsuario = document.getElementById('btnSalvarUsuario');

    const modalConfirmacao = document.getElementById('modalConfirmacao');
    const tituloConfirmacao = document.getElementById('tituloConfirmacao');
    const textoConfirmacao = document.getElementById('textoConfirmacao');
    const btnCancelarConfirmacao = document.getElementById('btnCancelarConfirmacao');
    const btnExecutarConfirmacao = document.getElementById('btnExecutarConfirmacao');

    let usuarios = [];
    let sortCampo = 'fullName';
    let sortDirecao = 'asc';
    let usuarioEditando = null;
    let confirmacaoPendente = null;

    function toggleMenuMobile() {
      const btnHamburger = document.getElementById('btnHamburger');
      const navbarMobileOverlay = document.getElementById('navbarMobileOverlay');
      const btnCloseMobileMenu = document.getElementById('btnCloseMobileMenu');

      function abrirMenuMobile() {
        navbarMobileOverlay.classList.add('ativo');
        navbarMobileOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      function fecharMenuMobile() {
        navbarMobileOverlay.classList.remove('ativo');
        navbarMobileOverlay.style.display = 'none';
        document.body.style.overflow = '';
      }

      btnHamburger.addEventListener('click', abrirMenuMobile);
      btnCloseMobileMenu.addEventListener('click', fecharMenuMobile);
      navbarMobileOverlay.addEventListener('click', function(e) {
        if (e.target === navbarMobileOverlay) fecharMenuMobile();
      });

      function atualizar() {
        if (window.innerWidth <= 900) {
          btnHamburger.style.display = 'block';
        } else {
          btnHamburger.style.display = 'none';
          fecharMenuMobile();
        }
      }

      window.addEventListener('resize', atualizar);
      atualizar();
    }

    function abrirModal(el) {
      el.classList.add('ativo');
    }

    function fecharModal(el) {
      el.classList.remove('ativo');
    }

    function limparErrosFormulario() {
      erroEmail.textContent = '';
      erroSenha.textContent = '';
      inputEmail.classList.remove('campo-erro');
      inputSenha.classList.remove('campo-erro');
      inputNome.classList.remove('campo-erro');
    }

    function formatarDataHora(dataIso) {
      if (!dataIso) return '—';
      const d = new Date(dataIso);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleString('pt-BR');
    }

    function aplicarFiltroStatus(lista) {
      const status = filtroStatus.value;
      if (status === 'todos') return lista;
      if (status === 'ativo') return lista.filter(u => u.isActive);
      return lista.filter(u => !u.isActive);
    }

    function ordenarUsuarios(lista) {
      const clone = [...lista];
      clone.sort((a, b) => {
        let va = a[sortCampo];
        let vb = b[sortCampo];

        if (sortCampo === 'isActive') {
          va = a.isActive ? 1 : 0;
          vb = b.isActive ? 1 : 0;
        }

        if (sortCampo === 'createdAt') {
          va = new Date(a.createdAt || 0).getTime();
          vb = new Date(b.createdAt || 0).getTime();
        }

        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();

        if (va < vb) return sortDirecao === 'asc' ? -1 : 1;
        if (va > vb) return sortDirecao === 'asc' ? 1 : -1;
        return 0;
      });
      return clone;
    }

    function renderizarTabela() {
      const filtrados = ordenarUsuarios(aplicarFiltroStatus(usuarios));

      if (!filtrados.length) {
        tabelaUsuarios.innerHTML = '<tr><td colspan="5" class="vazio">Nenhum usuário encontrado.</td></tr>';
        return;
      }

      tabelaUsuarios.innerHTML = filtrados.map(usuario => {
        const statusHtml = usuario.isActive
          ? '<span class="status-pill status-ativo">Ativo</span>'
          : '<span class="status-pill status-inativo">Inativo</span>';

        const botaoStatus = usuario.isActive
          ? `<button class="btn-acao btn-inativar" onclick="solicitarInativacaoUsuario('${usuario.id}')">Inativar</button>`
          : `<button class="btn-acao btn-reativar" onclick="solicitarReativacaoUsuario('${usuario.id}')">Reativar</button>`;

        return `
          <tr>
            <td>${usuario.fullName || '—'}</td>
            <td>${usuario.email || '—'}</td>
            <td>${statusHtml}</td>
            <td>${formatarDataHora(usuario.createdAt)}</td>
            <td>
              <div class="acoes">
                <button class="btn-acao btn-editar" onclick="abrirEdicaoUsuario('${usuario.id}')">Editar</button>
                ${botaoStatus}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function carregarUsuarios() {
      try {
        const resposta = await UsuariosApi.listar();
        usuarios = Array.isArray(resposta) ? resposta : (resposta.items || []);
        renderizarTabela();
      } catch (erro) {
        console.error('Erro ao carregar usuários', erro);
        Notificacao.erro('Não foi possível carregar usuários.');
      }
    }

    function abrirModalNovoUsuario() {
      usuarioEditando = null;
      tituloModalUsuario.textContent = 'Novo usuário';
      inputNome.value = '';
      inputEmail.value = '';
      inputSenha.value = '';
      blocoSenhaTemporaria.style.display = 'block';
      limparErrosFormulario();
      abrirModal(modalUsuario);
    }

    function abrirEdicaoUsuario(id) {
      const usuario = usuarios.find(u => u.id === id);
      if (!usuario) return;

      usuarioEditando = usuario;
      tituloModalUsuario.textContent = 'Editar usuário';
      inputNome.value = usuario.fullName || '';
      inputEmail.value = usuario.email || '';
      inputSenha.value = '';
      blocoSenhaTemporaria.style.display = 'none';
      limparErrosFormulario();
      abrirModal(modalUsuario);
    }

    function validarFormulario() {
      limparErrosFormulario();
      let valido = true;

      if (!inputNome.value.trim()) {
        inputNome.classList.add('campo-erro');
        Notificacao.aviso('Preencha este campo.');
        valido = false;
      }

      if (!Validador.email(inputEmail.value.trim())) {
        inputEmail.classList.add('campo-erro');
        erroEmail.textContent = 'Informe um e-mail válido.';
        valido = false;
      }

      if (!usuarioEditando && inputSenha.value.length < 8) {
        inputSenha.classList.add('campo-erro');
        erroSenha.textContent = 'A senha deve ter no mínimo 8 caracteres.';
        valido = false;
      }

      return valido;
    }

    async function salvarUsuario() {
      if (!validarFormulario()) return;

      try {
        if (usuarioEditando) {
          await UsuariosApi.atualizar(usuarioEditando.id, {
            fullName: inputNome.value.trim(),
            email: inputEmail.value.trim()
          });
          Notificacao.sucesso('Usuário atualizado com sucesso.');
        } else {
          await UsuariosApi.criar({
            fullName: inputNome.value.trim(),
            email: inputEmail.value.trim(),
            temporaryPassword: inputSenha.value,
            role: 'Admin'
          });
          Notificacao.sucesso('Usuário criado com sucesso.');
        }

        fecharModal(modalUsuario);
        await carregarUsuarios();
      } catch (erro) {
        const mensagem = erro?.mensagem || erro?.message || 'Falha ao salvar usuário.';
        if (mensagem.includes('e-mail')) {
          inputEmail.classList.add('campo-erro');
          erroEmail.textContent = 'Este e-mail já está em uso por outro usuário.';
        }
        Notificacao.erro(mensagem);
      }
    }

    function abrirConfirmacao(titulo, texto, acao) {
      tituloConfirmacao.textContent = titulo;
      textoConfirmacao.textContent = texto;
      confirmacaoPendente = acao;
      abrirModal(modalConfirmacao);
    }

    function solicitarInativacaoUsuario(id) {
      const alvo = usuarios.find(u => u.id === id);
      if (!alvo) return;

      const usuarioAtual = UsuarioManager.obterUsuario();
      if (usuarioAtual?.id === id) {
        Notificacao.aviso('Você não pode inativar o seu próprio usuário.');
        return;
      }

      abrirConfirmacao(
        'Confirmar inativação',
        `Tem certeza que deseja inativar ${alvo.fullName}? O acesso será encerrado imediatamente.`,
        async () => {
          await UsuariosApi.inativar(id);
          Notificacao.sucesso('Usuário inativado com sucesso.');
          await carregarUsuarios();
        }
      );
    }

    function solicitarReativacaoUsuario(id) {
      const alvo = usuarios.find(u => u.id === id);
      if (!alvo) return;

      abrirConfirmacao(
        'Confirmar reativação',
        `Deseja reativar ${alvo.fullName}? O acesso será restaurado.`,
        async () => {
          await UsuariosApi.reativar(id);
          Notificacao.sucesso('Usuário reativado com sucesso.');
          await carregarUsuarios();
        }
      );
    }

    document.querySelectorAll('th button[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        const campo = btn.getAttribute('data-sort');
        if (sortCampo === campo) {
          sortDirecao = sortDirecao === 'asc' ? 'desc' : 'asc';
        } else {
          sortCampo = campo;
          sortDirecao = 'asc';
        }
        renderizarTabela();
      });
    });

    btnNovoUsuario.addEventListener('click', abrirModalNovoUsuario);
    btnCancelarModalUsuario.addEventListener('click', () => fecharModal(modalUsuario));
    btnSalvarUsuario.addEventListener('click', salvarUsuario);
    filtroStatus.addEventListener('change', renderizarTabela);

    btnCancelarConfirmacao.addEventListener('click', () => {
      confirmacaoPendente = null;
      fecharModal(modalConfirmacao);
    });

    btnExecutarConfirmacao.addEventListener('click', async () => {
      if (!confirmacaoPendente) return;
      try {
        await confirmacaoPendente();
      } catch (erro) {
        const msg = erro?.mensagem || erro?.message || 'Falha ao executar ação.';
        Notificacao.erro(msg);
      } finally {
        confirmacaoPendente = null;
        fecharModal(modalConfirmacao);
      }
    });

    modalUsuario.addEventListener('click', (e) => {
      if (e.target === modalUsuario) fecharModal(modalUsuario);
    });

    modalConfirmacao.addEventListener('click', (e) => {
      if (e.target === modalConfirmacao) {
        confirmacaoPendente = null;
        fecharModal(modalConfirmacao);
      }
    });

    window.abrirEdicaoUsuario = abrirEdicaoUsuario;
    window.solicitarInativacaoUsuario = solicitarInativacaoUsuario;
    window.solicitarReativacaoUsuario = solicitarReativacaoUsuario;

    toggleMenuMobile();
    carregarUsuarios();
  </script>
</body>
</html>
